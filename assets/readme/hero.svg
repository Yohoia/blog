<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Yohoia Blog — Next.js personal site with read-only PageHush publishing</title>
  <desc id="hero-desc">A warm paper canvas, organic dot grid, terminal card, and the site sections Blog, Project, and Skill.</desc>
  <defs>
    <pattern id="organic-dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#1b1b18" opacity="0.10"/>
      <circle cx="29" cy="25" r="1.2" fill="#6b8cff" opacity="0.16"/>
      <circle cx="16" cy="35" r="1" fill="#1b1b18" opacity="0.07"/>
    </pattern>
    <linearGradient id="paper-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#f6f5f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#paper-edge)"/>
  <rect width="1200" height="620" fill="url(#organic-dots)"/>
  <path d="M72 486c112-42 176-16 268-58s132-112 246-138 177 31 286-8" fill="none" stroke="#6b8cff" stroke-width="2" stroke-linecap="round" opacity=".20"/>
  <path d="M72 522c126-36 186-8 276-46s138-96 248-118 172 27 276-9" fill="none" stroke="#1b1b18" stroke-width="1.4" stroke-linecap="round" opacity=".10"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="72" y="126" fill="#706f67" font-size="23" font-weight="650" letter-spacing="4.5">NEXT.JS 16 · REACT 19 · PAGEHUSH READ-ONLY</text>
    <text x="70" y="226" fill="#1b1b18" font-size="82" font-weight="760" letter-spacing="-2.5">Yohoia · Blog</text>
    <rect x="74" y="252" width="82" height="7" rx="3.5" fill="#6b8cff"/>
    <text x="72" y="316" fill="#5f5e58" font-size="36" font-weight="520">保留原站视觉与真实内容</text>
    <text x="72" y="364" fill="#5f5e58" font-size="36" font-weight="520">本地 Markdown / PageHush 共用</text>
    <text x="72" y="412" fill="#5f5e58" font-size="36" font-weight="520">只读渲染与发布过滤链路</text>

    <g transform="translate(72 482)">
      <rect x="0" y="0" width="172" height="48" rx="24" fill="#1b1b18"/>
      <text x="34" y="31" fill="#f5f4ee" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/blog</text>
      <rect x="188" y="0" width="188" height="48" rx="24" fill="#fbfaf7" stroke="#1b1b18" stroke-opacity=".16"/>
      <text x="222" y="31" fill="#1b1b18" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/project</text>
      <rect x="396" y="0" width="164" height="48" rx="24" fill="#fbfaf7" stroke="#1b1b18" stroke-opacity=".16"/>
      <text x="428" y="31" fill="#1b1b18" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/skill</text>
    </g>

    <g transform="translate(716 102)">
      <rect x="0" y="0" width="412" height="390" rx="28" fill="#151611"/>
      <rect x="0" y="0" width="412" height="390" rx="28" fill="none" stroke="#f5f4ee" stroke-opacity=".12"/>
      <circle cx="35" cy="36" r="6" fill="#df6c75"/>
      <circle cx="58" cy="36" r="6" fill="#e2a84a"/>
      <circle cx="81" cy="36" r="6" fill="#56c596"/>
      <text x="34" y="105" fill="#f5f4ee" fill-opacity=".64" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">yohoia@site:~$</text>
      <text x="34" y="151" fill="#f5f4ee" font-size="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run dev</text>
      <rect x="34" y="182" width="344" height="1" fill="#f5f4ee" opacity=".12"/>
      <text x="34" y="229" fill="#56c596" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">✔ Next.js ready</text>
      <text x="34" y="277" fill="#f5f4ee" fill-opacity=".80" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Blog · Project · Skill</text>
      <rect x="34" y="308" width="150" height="39" rx="19.5" fill="#6b8cff" fill-opacity=".18"/>
      <text x="58" y="334" fill="#a8bcff" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">zh / en</text>
      <rect x="196" y="308" width="150" height="39" rx="19.5" fill="#f5f4ee" fill-opacity=".08"/>
      <text x="220" y="334" fill="#f5f4ee" fill-opacity=".76" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no-JS first</text>
      <rect x="272" y="348" width="12" height="26" rx="2" fill="#56c596"/>
    </g>
  </g>
</svg>
