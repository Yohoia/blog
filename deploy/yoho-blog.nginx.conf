# Canonical production site: https://yohoia.cn
# The Node service is managed by yoho-blog.service and only listens on loopback.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server ipv6only=on;

    server_name yohoia.cn;

    ssl_certificate /etc/letsencrypt/live/yohoia.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yohoia.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yoho-blog/current;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location ^~ /_next/static/ {
        alias /var/www/yoho-blog/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /media/ {
        root /var/www/yoho-blog/current/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        root /var/www/yoho-blog/current/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        root /var/www/yoho-blog/current/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /images/ {
        root /var/www/yoho-blog/current/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /cursors/ {
        root /var/www/yoho-blog/current/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 502 503 504 /502.html;

    location = /502.html {
        internal;
        root /var/www/yoho-blog/nginx-errors;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.yohoia.cn;

    ssl_certificate /etc/letsencrypt/live/yohoia.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yohoia.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yohoia.cn$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name yohoia.cn www.yohoia.cn;

    return 301 https://yohoia.cn$request_uri;
}
