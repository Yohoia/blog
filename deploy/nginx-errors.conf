# 可选：在 Nginx 的静态站点 server 块中 include 此文件。
# server 的 root 须指向本项目 dist，普通路由使用 try_files $uri $uri/ =404。
# 保留原 HTTP 状态码，通过内部跳转显示对应插图；不要改成 =200。
error_page 403 /403/index.html;
error_page 404 /404.html;
error_page 500 /500.html;
error_page 502 /502/index.html;

# 如果页面请求经过反向代理，在相应的 proxy location 中另加
# proxy_intercept_errors on; 才会接管上游错误响应。
# 此配置不会自动部署，也不能覆盖 CDN / 代理自身生成的错误页。
